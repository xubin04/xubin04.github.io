<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navigation-overflow"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="/#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.external %}
              <li class="masthead__menu-item"><a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.title }}</a></li>
            {% else %}
              <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
            {% endif %}
          {% endfor %}
        </ul>
        <ul id="navigation-overflow" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
